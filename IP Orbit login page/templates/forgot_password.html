<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | IP Orbit</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <!-- LOADING SCREEN -->
<div id="loader">
    <div class="loader-content">
        <div class="loader-spinner"></div>
        <h2>IP Orbit</h2>
        <p>Loading, please wait...</p>
    </div>
</div>

<header>
    <div class="logo">IP<span>Orbit</span></div>
    <div class="header-right">Network Information System</div>
</header>

<main class="auth-container">
    <section class="auth-card">

        <h1>Forgot Password?</h1>
        <p>Recover your IP Orbit account.</p>

        <!-- REQUEST RECOVERY CODE -->

        <form id="forgotForm">

            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail"
                       placeholder="Enter registered email" required>
            </div>

            <button type="submit" class="primary-btn">
                Send Recovery Code
            </button>

        </form>

        <!-- RESET PASSWORD -->

        <form id="recoveryForm" hidden>

            <div class="form-group">
                <label for="recoveryOTP">Recovery Code</label>
                <input type="text" id="recoveryOTP"
                       placeholder="Enter 6-digit code"
                       maxlength="6" pattern="[0-9]{6}"
                       inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <div class="password-wrapper">
                    <input type="password" id="newPassword"
                           placeholder="Enter new password"
                           minlength="8" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword('newPassword', this)"
                            aria-label="Show password">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>

                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword"
                           placeholder="Confirm new password"
                           minlength="8" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword('confirmNewPassword', this)"
                            aria-label="Show password">👁</button>
                </div>
            </div>

            <button type="submit" class="primary-btn">
                Reset Password
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="auth-switch">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>

    </section>
</main>

<footer>© 2026 IP Orbit | Network Information System</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
