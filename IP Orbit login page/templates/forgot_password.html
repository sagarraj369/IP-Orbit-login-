<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Orbit - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>

    <header class="auth-header">
        <a href="/" class="logo">IP Orbit</a>
        <a href="/login" class="header-link">Login</a>
    </header>

    <main class="auth-main">

        <div class="auth-container">

            <h1>Forgot Password?</h1>

            <p class="auth-subtitle">
                Enter your registered email address.
                We'll send you a password-reset link.
            </p>

            <div id="message"></div>

            <form id="forgotPasswordForm" class="auth-form">

                <div class="form-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your registered email"
                        required>

                </div>

                <button type="submit" class="auth-button">
                    Send Reset Link
                </button>

            </form>

            <p class="auth-bottom-text">
                Remember your password?
                <a href="/login">Back to Login</a>
            </p>

        </div>

    </main>

    <footer class="site-footer">

        <div class="footer-bottom">
            <p>© 2026 IP Orbit | Network Information System</p>
            <p>Built By Sagar Raj</p>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
