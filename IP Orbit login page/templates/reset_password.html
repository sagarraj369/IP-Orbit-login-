<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Orbit - Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="{{ url_for('static', filename='auth.js') }}"></script>
</head>

<body>

<header class="auth-header">
    <a href="/" class="logo">IP Orbit</a>
    <a href="/login" class="header-link">Login</a>
</header>

<main class="auth-main">

    <div class="auth-container">

        <h1>Reset Password</h1>

        <p class="auth-subtitle">
            Create a new password for your IP Orbit account.
        </p>

        <div id="message"></div>

        <form id="recoveryForm" class="auth-form">

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmNewPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-button">
                Update Password
            </button>

        </form>

        <p class="auth-bottom-text">
            Remember your password?
            <a href="/login">Back to Login</a>
        </p>

    </div>

</main>

<footer class="site-footer">
    <div class="footer-bottom">
        <p>© 2026 IP Orbit | Network Information System</p>
        <p>Built By Sagar Raj</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
