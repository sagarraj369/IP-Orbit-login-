<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Orbit - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>

<header class="auth-header">
    <a href="/" class="logo">IP Orbit</a>
    <a href="/login" class="header-link">Login</a>
</header>

<main class="auth-main">

    <div class="auth-container">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join IP Orbit and explore your network world.
        </p>

        <div id="message"></div>

        <form id="registerForm" class="auth-form">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="Enter your phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="termsAccepted" required>

                <label for="termsAccepted">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        <p class="auth-bottom-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</main>

<footer class="site-footer">
    <div class="footer-bottom">
        <p>© 2026 IP Orbit | Network Information System</p>
        <p>Built By Sagar Raj</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
