<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | IP Orbit</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <!-- LOADING SCREEN -->
<div id="loader">
    <div class="loader-content">
        <div class="loader-spinner"></div>
        <h2>IP Orbit</h2>
        <p>Loading, please wait...</p>
    </div>
</div>

<header>
    <div class="logo">IP<span>Orbit</span></div>
    <div class="header-right">Network Information System</div>
</header>

<main class="auth-container">
    <section class="auth-card">

        <h1>Create Account</h1>
        <p>Register to explore IP Orbit</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber"
                       placeholder="Enter 10-digit phone number"
                       maxlength="10" pattern="[0-9]{10}"
                       inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="registerPassword"
                           placeholder="Create a password"
                           minlength="8" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword('registerPassword', this)"
                            aria-label="Show password">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input type="password" id="confirmPassword"
                           placeholder="Confirm your password"
                           minlength="8" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="Show password">👁</button>
                </div>
            </div>

            <button type="submit" class="primary-btn">
                Create Account
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </section>
</main>

<footer>© 2026 IP Orbit | Network Information System</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
