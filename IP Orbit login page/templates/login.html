<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IP Orbit</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <!-- LOADING SCREEN -->
<div id="loader">
    <div class="loader-content">
        <div class="loader-spinner"></div>
        <h2>IP Orbit</h2>
        <p>Loading, please wait...</p>
    </div>
</div>

<header>
    <div class="logo">IP<span>Orbit</span></div>
    <div class="header-right">Network Information System</div>
</header>

<main class="auth-container">
    <section class="auth-card">

        <h1>Welcome Back</h1>
        <p>Login to continue to IP Orbit</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="loginPassword"
                           placeholder="Enter your password" required>

                    <button type="button" class="toggle-password"
                            onclick="togglePassword('loginPassword', this)"
                            aria-label="Show password">👁</button>
                </div>
            </div>

            <div class="forgot-link">
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            </div>

            <button type="submit" class="primary-btn">Login</button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </div>

    </section>
</main>

<footer>© 2026 IP Orbit | Network Information System</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
<script src="{{ url_for('static', filename='loader.js') }}"></script>

</body>
</html>
