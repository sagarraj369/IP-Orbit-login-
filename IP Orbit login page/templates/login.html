<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Orbit - Login</title>

    <!-- IP Orbit Favicon -->
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='ip-orbit-icon.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">

</head>

<body>

    <!-- HEADER -->
    <header class="auth-header">
        <a href="/" class="logo">IP Orbit</a>
        <a href="/" class="header-link">Home</a>
    </header>

    <!-- LOGIN SECTION -->
    <main class="auth-main">

        <div class="auth-container">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to IP Orbit
            </p>

            <div id="message"></div>

            <form id="loginForm" class="auth-form">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('loginPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="/forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <p class="auth-bottom-text">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>© 2026 IP Orbit | Network Information System</p>
            <p>Built By Sagar Raj</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
